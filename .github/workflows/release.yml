name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  WHISPER_CPP_REF: 3e9b7d0fef3528ee2208da3cdb873a2c53d2ae2f
  SILERO_MODEL_URL: https://huggingface.co/piyazon/pichier-flow-models/resolve/main/silero-v6.2.1-ggml.bin
  WHISPER_SMALL_MODEL_URL: https://huggingface.co/piyazon/pichier-flow-models/resolve/main/whisper-small-q5_0.bin
  WHISPER_SMALL_UYGHUR_MODEL_URL: https://huggingface.co/piyazon/pichier-flow-models/resolve/main/whisper-small-uyghur-q5_0.bin

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64-Metal
            os: macos-15
            cmake_backend_args: "-DGGML_METAL=ON -DGGML_VULKAN=OFF"
            asr_sidecar: "ASR"
            install_vulkan: "false"
            bundle_moltenvk: "false"
            tauri_args: ""
          - name: macOS-x64-Vulkan
            os: macos-15-intel
            cmake_backend_args: "-DGGML_METAL=OFF -DGGML_VULKAN=ON"
            asr_sidecar: "ASR-vulkan"
            install_vulkan: "true"
            bundle_moltenvk: "true"
            tauri_args: ""
          - name: Windows-x64-Vulkan
            os: windows-latest
            cmake_backend_args: "-DGGML_VULKAN=ON"
            asr_sidecar: "ASR-vulkan.exe"
            install_vulkan: "true"
            bundle_moltenvk: "false"
            tauri_args: "--config src-tauri/tauri.windows.conf.json"
          - name: Linux-x64-Vulkan
            os: ubuntu-latest
            cmake_backend_args: "-DGGML_VULKAN=ON"
            asr_sidecar: "ASR-vulkan"
            install_vulkan: "true"
            bundle_moltenvk: "false"
            tauri_args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            file \
            glslc \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libvulkan-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            spirv-headers \
            vulkan-tools
        shell: bash

      - name: Install macOS Vulkan SDK dependencies
        if: runner.os == 'macOS' && matrix.install_vulkan == 'true'
        run: brew install molten-vk shaderc spirv-headers vulkan-headers vulkan-loader
        shell: bash

      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows' && matrix.install_vulkan == 'true'
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdk) {
            throw "Vulkan SDK was not installed under C:\VulkanSDK"
          }
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          "$($sdk.FullName)\Bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
        shell: bash

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Checkout whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_CPP_REF }}
          path: whisper.cpp
          persist-credentials: false

      - name: Download public model assets
        run: bash scripts/ci/download-models.sh frontend/src-tauri/server
        shell: bash

      - name: Build native ASR sidecar
        env:
          CMAKE_BACKEND_ARGS: ${{ matrix.cmake_backend_args }}
          INSTALL_VULKAN: ${{ matrix.install_vulkan }}
        run: |
          whisper_cpp_dir="$(pwd)/whisper.cpp"

          if [[ "$RUNNER_OS" == "macOS" && "${INSTALL_VULKAN}" == "true" ]]; then
            spirv_include="$(brew --prefix spirv-headers)/include"
            vulkan_include="$(brew --prefix vulkan-headers)/include"

            if [[ ! -f "${spirv_include}/spirv/unified1/spirv.hpp" ]]; then
              echo "::error::SPIR-V header was not found at ${spirv_include}/spirv/unified1/spirv.hpp"
              exit 1
            fi

            export CPATH="${spirv_include}:${vulkan_include}:${CPATH:-}"
            export CPLUS_INCLUDE_PATH="${spirv_include}:${vulkan_include}:${CPLUS_INCLUDE_PATH:-}"
          fi

          cmake_args=(
            -S .
            -B build
            -DCMAKE_BUILD_TYPE=Release
            -DWHISPER_CPP_DIR="${whisper_cpp_dir}"
            -DBUILD_SHARED_LIBS=OFF
          )
          if [[ -n "${CMAKE_BACKEND_ARGS}" ]]; then
            read -r -a backend_args <<< "${CMAKE_BACKEND_ARGS}"
            cmake_args+=("${backend_args[@]}")
          fi
          cmake "${cmake_args[@]}"
          cmake --build build --config Release --target ASR --parallel 2
        shell: bash

      - name: Normalize ASR sidecar name
        run: bash scripts/ci/normalize-asr-sidecar.sh frontend/src-tauri/server "${{ matrix.asr_sidecar }}"
        shell: bash

      - name: Bundle Windows Vulkan runtime
        if: runner.os == 'Windows' && matrix.install_vulkan == 'true'
        run: |
          $searchRoots = @()
          if ($env:VULKAN_SDK) {
            $searchRoots += Join-Path $env:VULKAN_SDK "Bin"
            $searchRoots += Join-Path $env:VULKAN_SDK "Bin32"
          }
          $searchRoots += Join-Path $env:WINDIR "System32"
          $searchRoots += Join-Path $env:WINDIR "SysWOW64"

          $loader = Get-ChildItem -Path $searchRoots -Filter "vulkan-1.dll" -File -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($loader) {
            Copy-Item $loader.FullName "frontend/src-tauri/server/vulkan-1.dll" -Force
            Get-Item "frontend/src-tauri/server/vulkan-1.dll"
          } else {
            Write-Warning "vulkan-1.dll was not found in the SDK or Windows system directories. Continuing because Vulkan drivers normally install the loader on target machines."
          }
        shell: pwsh

      - name: Bundle macOS Vulkan runtime
        if: matrix.bundle_moltenvk == 'true'
        run: bash scripts/ci/install-macos-vulkan-runtime.sh frontend/src-tauri/server
        shell: bash

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
        shell: bash

      - name: Install ffmpeg sidecar
        working-directory: frontend
        run: |
          npm install --no-save ffmpeg-static
          node ../scripts/ci/install-ffmpeg-sidecar.cjs .
        shell: bash

      - name: Build Tauri app
        working-directory: frontend
        env:
          TAURI_ARGS: ${{ matrix.tauri_args }}
        run: npm run tauri -- build ${TAURI_ARGS}
        shell: bash

      - name: Collect installer packages
        run: bash scripts/ci/collect-release-artifacts.sh
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PichirFlow-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
