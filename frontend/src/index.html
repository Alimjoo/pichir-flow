<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>PichirFlow</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="app-shell">
      <aside class="projects-panel" data-i18n-aria-label="app.projectsAria" aria-label="Projects">
        <div class="panel-header">
          <div class="panel-title-row">
            <h2 id="sidePanelTitle" data-i18n="projects.title">Projects</h2>
            <button
              id="aboutBtn"
              class="author-mark about-button"
              type="button"
              aria-haspopup="dialog"
              aria-controls="aboutModal"
              data-i18n-title="about.title"
              title="About"
            >
              <img data-secure-image="penguin" alt="" aria-hidden="true" />
              <span data-i18n="about.button">About</span>
            </button>
          </div>
          <div class="panel-actions">
            <button id="resumeAllBtn" class="resume-all-button" type="button" hidden>
              <span data-i18n="projects.resumeAll">Resume all</span>
            </button>
            <button id="clearProjectsBtn" class="clear-projects-button" type="button">
              <span data-i18n="projects.clearAll">Clear all</span>
            </button>
          </div>
          <div id="asrBatchProgress" class="asr-batch-progress" hidden>
            <div class="asr-batch-progress-meta">
              <span id="asrBatchProgressLabel" data-i18n="projects.batchWaiting">Waiting</span>
              <strong id="asrBatchProgressValue">0/0</strong>
            </div>
            <div class="asr-batch-progress-track">
              <div id="asrBatchProgressBar" class="asr-batch-progress-bar"></div>
            </div>
          </div>
        </div>

        <div id="projectList" class="project-list"></div>
      </aside>

      <section class="workbench" data-i18n-aria-label="app.workbenchAria" aria-label="Speech recognition">
        <header class="app-header">
          <div>
            <div class="app-title-line">
              <h1 id="appTitle" data-i18n="app.title">Voice Transcription</h1>
            </div>
            <div id="activeProjectTitle" class="active-project-title">
              New transcription
            </div>
          </div>

          <button
            id="settingsBtn"
            class="icon-button settings-button"
            type="button"
            title="Settings"
            aria-label="Settings"
            data-i18n="settings.title"
            data-i18n-title="settings.title"
            data-i18n-aria-label="settings.title"
          >
            Settings
          </button>

          <div class="status-block">
            <div id="serverLed" class="server-offline" title="Model" data-i18n-title="status.modelLabel"></div>
            <span id="backendLabel" class="backend-label"></span>
            <div id="status" class="status" data-status-key="status.modelStarting">Model starting...</div>
          </div>
        </header>

        <section id="asrPanel" class="mode-panel asr-panel">
          <div class="toolbar">
            <button id="startBtn" class="primary-button" type="button">
              <span data-i18n="toolbar.start">Start</span>
            </button>
            <button id="stopBtn" class="secondary-button" type="button">
              <span data-i18n="toolbar.stop">Stop</span>
            </button>

            <label class="file-picker">
              <span class="file-picker-caption" data-i18n="file.caption">Audio or video</span>
              <span class="file-picker-control">
                <span class="file-picker-action" data-i18n="file.choose">Choose file</span>
                <span id="selectedFileName" class="selected-file-name">
                  No file selected
                </span>
              </span>
              <input
                id="audioFile"
                class="file-input-hidden"
                type="file"
                accept="audio/*,video/*"
                multiple
              />
            </label>

            <button id="fileBtn" class="file-button" type="button">
              <span data-i18n="file.transcribe">Transcribe file</span>
            </button>
          </div>

          <section class="transcript-pane" data-i18n-aria-label="timeline.resultAria" aria-label="Result">
            <span id="confirmed"></span><span id="unconfirmed"></span>
          </section>

          <section class="timeline-pane" data-i18n-aria-label="timeline.title" aria-label="Timeline">
            <div class="timeline-header">
              <h2 id="resultPaneTitle" data-i18n="timeline.title">Timeline</h2>
              <div class="view-switch" role="group" data-i18n-aria-label="timeline.view" aria-label="View">
                <button id="wholeViewBtn" type="button" data-i18n="timeline.whole">Whole</button>
                <button id="timelineViewBtn" type="button" data-i18n="timeline.time">Time</button>
              </div>
              <span id="segmentCount">Uyghur</span>
            </div>

            <div id="timeline" class="result-content timeline-list"></div>
          </section>
        </section>
      </section>

      <footer class="app-license-footer" data-i18n-aria-label="app.footerAria" aria-label="Ownership and license">
        <span data-i18n="about.footer">PichirFlow Non-Commercial License 1.0</span>
      </footer>
    </main>

    <div id="settingsModal" class="modal-backdrop" hidden>
      <section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-dialog-header">
          <h2 id="settingsTitle" data-i18n="settings.title">Settings</h2>
          <button id="settingsCloseBtn" class="icon-button" type="button" aria-label="Close" data-i18n-aria-label="settings.close">
            ×
          </button>
        </div>

        <label class="setting-field">
          <span data-i18n="settings.asrLanguage">Language</span>
          <select id="asrLanguageSelect" dir="auto"></select>
        </label>

        <label class="setting-field">
          <span>
            <span data-i18n="settings.maxUnconfirmed">Maximum no-silence time:</span>
            <strong id="maxUnconfirmedValue">15s</strong>
          </span>
          <input
            id="maxUnconfirmedRange"
            type="range"
            min="3"
            max="20"
            step="1"
            value="15"
          />
        </label>

        <label class="setting-field">
          <span data-i18n="settings.displayLanguage">Display language</span>
          <select id="displayLanguageSelect" dir="auto"></select>
        </label>

        <div class="settings-actions">
          <button id="settingsConfirmBtn" class="settings-confirm-button" type="button">
            <span data-i18n="settings.confirm">Confirm</span>
          </button>
        </div>
      </section>
    </div>

    <div id="aboutModal" class="modal-backdrop" hidden>
      <section class="about-dialog" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
        <div class="settings-dialog-header">
          <h2 id="aboutTitle" data-i18n="about.title">About</h2>
          <button id="aboutCloseBtn" class="icon-button" type="button" aria-label="Close" data-i18n-aria-label="about.close">
            ×
          </button>
        </div>

        <div class="about-brand">
          <div class="about-logo-circle">
            <img data-secure-image="penguin" alt="" aria-hidden="true" />
          </div>
          <strong><bdi dir="ltr" data-i18n="about.author">Piyazon</bdi></strong>
          <a href="https://piyazon.top/" target="_blank" rel="noreferrer noopener" dir="ltr">
            https://piyazon.top/
          </a>
        </div>
      </section>
    </div>

  </body>
</html>
